name: Test Installation

on:
  workflow_call: # Make this workflow reusable
    inputs:
      python-versions:
        description: 'Python versions to test'
        required: false
        default: "['3.12', '3.13', '3.14']"
        type: string

jobs:
  test:
    name: Test installation on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Drop intel macOS unless needed
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          uv sync --no-dev

      - name: Verify installation
        run: |
          uv run python -c "import pyAMARES; print('pyAMARES version:', pyAMARES.__version__)"
          uv run amaresFit --help
