name: Test Notebooks

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Python versions to test'
        required: false
        default: "['3.12', '3.13', '3.14']" # Gets overridden by auto caller depending on branch
        type: string

jobs:
  test-notebooks:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # uv sync automatically installs [project.dependencies] and
        # the default packages in [dependency-groups]
        run: uv sync --group dev

      - name: Register environment kernel
        # Without this, --nbval-current-env might fail to find a kernel
        # mapping to the isolated uv python environment
        run: uv run python -m ipykernel install --user --name python3

      - name: Run notebook tests
        # uv run will automatically use the venv we synced
        run: uv run pytest tests/

      - name: Upload executed notebooks on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks-py${{ matrix.python-version }}
          path: tests/*_executed.ipynb
