[project]
name = "pyAMARES"
dynamic = ["version"]
description = "PyAMARES, an Open-Source Python Library for Fitting Magnetic Resonance Spectroscopy Data"
readme = "README.rst"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Jia Xu", email = "jia-xu-1@uiowa.edu" },
    { name = "Sebastian Bauer", email = "shb50@cam.ac.uk" },
]
keywords = ["magnetic resonance", "spectroscopy", "fitting", "MRS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "nmrglue",
    "numpy",
    "pandas",
    "scipy",
    "setuptools",
    "sympy",
    "lmfit",
    "mat73",
    "tqdm",
    "notebook",
    "hlsvdpro>=2.0.0; (platform_machine == 'x86_64' or platform_machine == 'amd64')",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "ipykernel",
    "notebook",
    "nbval",
    "sphinx",
    "nbsphinx",
    "sphinx_tabs",
    "sphinx_rtd_theme",
    "Pygments",
    "ipywidgets",
    "ruff",
    "pre-commit",
    "pytest",
    "streamlit>=1.57.0",
    "jupytext",
]

[project.scripts]
amaresFit = "pyAMARES.script.amaresfit:main"

[tool.pytest.ini_options]
addopts = "--nbval-lax --nbval-current-env -v"
testpaths = ["tests"]

[tool.jupytext]
# Tutorial notebooks under tests/ are authored and reviewed as MyST Markdown
# (git-friendly diffs, no baked-in outputs, immune to the .ipynb JSON/CRLF
# churn that plain-committed notebooks are prone to). The paired .ipynb is a
# generated artifact, regenerated before tests run — see tests/conftest.py.
formats = "ipynb,md:myst"
notebook_metadata_filter = "-all, kernelspec.name, kernelspec.language, kernelspec.display_name, jupytext.text_representation.extension, jupytext.text_representation.format_name"
cell_metadata_filter = "-all, tags, name"

[tool.ruff]
line-length = 88
# target-version = "py37"
exclude = ["*.ipynb"]
lint.select = [
    "E",
    "F",
    "I",
    "NPY",
    "UP",
] # Errors, Failures, Isort, NumPy, Upgrade
lint.ignore = ["E741", "E501"]

[project.urls]
homepage = "https://github.com/hawkMRS/pyAMARES"
repository = "https://github.com/hawkMRS/pyAMARES"
documentation = "https://pyamares.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pyAMARES/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyAMARES"]
